<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>physics-footer — drag &amp; throw any HTML element</title>
  <meta name="description" content="Drop real physics into any HTML element — grab, fling, and pile up draggable tags. Vanilla JS + Matter.js + Vite." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <section class="hero">
    <p class="kicker">Open-source · MIT</p>
    <h1>Drop real physics into <em>any HTML element.</em></h1>
    <a class="cta" href="https://github.com/tahabakri/physics-footer" target="_blank" rel="noopener">View on GitHub →</a>
    <div class="scroll-cue"><span>scroll to the footer ↓</span></div>
  </section>

  <section class="footer" id="footer">
    <div class="footer-content">
      <h2>Drag. Throw. <em>Repeat.</em></h2>
      <p class="sub">grab a tag · fling it · or add your own ↓</p>
    </div>

    <div class="object-container" id="object-container"></div>

    <div class="controls">
      <input id="tag-input" type="text" maxlength="24" placeholder="add a tag…" autocomplete="off" />
      <button class="drop" id="drop-btn">drop</button>
      <button class="reset" id="reset-btn">reset</button>
    </div>
    <p class="credit">Built with Matter.js</p>
    <div class="grain"></div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
